<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Lesson | SAR Driving School</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
  @media (max-width: 768px) {
    .hamburger {
      display: flex !important;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      padding: 8px;
      background: none;
      border: none;
      z-index: 201;
    }
    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: #111111;
      border-radius: 2px;
      transition: all 0.3s ease;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    nav ul {
      display: none !important;
    }
    nav ul.open {
      display: flex !important;
      flex-direction: column;
      position: absolute;
      top: 70px;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid #eeeeee;
      padding: 0.5rem 1.5rem 1.25rem;
      gap: 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      z-index: 200;
    }
    nav ul a {
      display: block;
      padding: 0.9rem 0;
      font-size: 1rem;
      color: #111111;
      border-bottom: 1px solid #f0f0f0;
    }
    .nav-inner {
      position: relative;
      height: 70px;
    }
    .hero-slideshow {
      grid-template-columns: 1fr !important;
    }
    .slide:nth-child(2),
    .slide:nth-child(3) {
      display: none !important;
    }
  }
</style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="SAR Driving School" class="logo-img">
      </a>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <ul id="nav-menu">
        <li><a href="lessons.html">Lessons</a></li>
        <li><a href="pricing.html">Pricing</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="socials.html">Find us</a></li>
        <li><a href="book.html" class="btn-nav">Book now</a></li>
      </ul>
    </div>
  </nav>

  <main>

    <section class="page-hero">
      <div class="page-hero-inner">
        <div class="section-label">Get started</div>
        <h1>Book your lesson</h1>
        <p>Pick a date and time that suits you. We'll confirm within a few hours.</p>
      </div>
    </section>

    <section class="book-section">
      <div class="book-inner">
        <div style="width:100%;height:100%;overflow:scroll" id="my-cal-inline-driving-lesson"></div>
        <script type="text/javascript">
          (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if(typeof namespace === "string"){cal.ns[namespace] = cal.ns[namespace] || api;p(cal.ns[namespace], ar);p(cal, ["initNamespace", namespace]);} else p(cal, ar); return;} p(cal, ar); }; })(window, "https://app.cal.eu/embed/embed.js", "init");
          Cal("init", "driving-lesson", {origin:"https://app.cal.eu"});
          Cal.ns["driving-lesson"]("inline", {
            elementOrSelector:"#my-cal-inline-driving-lesson",
            config: {"layout":"month_view","useSlotsViewOnSmallScreen":"true"},
            calLink: "s-rizwan-wmi8l6/driving-lesson",
          });
          Cal.ns["driving-lesson"]("ui", {"hideEventTypeDetails":false,"layout":"month_view"});
        </script>
      </div>
    </section>

  </main>

  <footer>
    <p>© 2026 SAR Driving School. Milton Keynes & surrounding areas.</p>
  </footer>

  <script>
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('nav-menu');
    hamburger.addEventListener('click', function() {
      hamburger.classList.toggle('open');
      navMenu.classList.toggle('open');
    });
    navMenu.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        hamburger.classList.remove('open');
        navMenu.classList.remove('open');
      });
    });
  </script>

</body>
</html>
