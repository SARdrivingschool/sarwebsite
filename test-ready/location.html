<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Guide | SAR Test Ready</title>
  <link rel="stylesheet" href="test-ready.css">
</head>
<body>
  <a class="tr-skip" href="#main">Skip to content</a>
  <header class="tr-header" id="tr-header"></header>

  <main id="main" class="tr-wrap">
    <p class="tr-status" id="tr-status" role="status">Loading…</p>

    <article id="tr-location" hidden>
      <h1 id="loc-name"></h1>
      <p><span id="loc-level"></span></p>
      <p class="tr-lead" id="loc-description"></p>

      <div class="tr-buttons" id="loc-directions"></div>

      <h2>Video guide</h2>
      <p id="loc-progress" class="tr-hint" role="status"></p>
      <div id="loc-videos"></div>

      <h2 id="loc-tips-heading" hidden>Driving tips</h2>
      <p class="tr-tips" id="loc-tips" hidden></p>

      <h2 id="loc-mistakes-heading" hidden>Common mistakes</h2>
      <p class="tr-tips" id="loc-mistakes" hidden></p>
    </article>

    <a class="tr-button tr-quiet tr-back" href="index.html">Back to all guides</a>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="test-ready.js"></script>
  <script>
    (function () {
      var T = window.TR;
      T.renderHeader('guides');
      var client = T.client();
      var status = document.getElementById('tr-status');
      var id = new URLSearchParams(window.location.search).get('id');
      var uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      var userId = null;
      var videoIds = [];

      function fail(message) {
        status.textContent = message;
      }

      function setText(elementId, value) {
        var el = document.getElementById(elementId);
        if (value && String(value).trim()) {
          el.textContent = String(value).trim();
          el.hidden = false;
          var heading = document.getElementById(elementId + '-heading');
          if (heading) heading.hidden = false;
        }
      }

      function renderDirections(lat, lon, name) {
        var holder = document.getElementById('loc-directions');
        if (lat == null || lon == null) {
          holder.innerHTML = '';
          return;
        }
        var label = T.esc(name);
        holder.innerHTML =
          '<a class="tr-button" href="https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lon + '" aria-label="Get directions to ' + label + ' in Google Maps">Directions (Google Maps)</a>' +
          '<a class="tr-button tr-secondary" href="https://maps.apple.com/?daddr=' + lat + ',' + lon + '" aria-label="Get directions to ' + label + ' in Apple Maps">Directions (Apple Maps)</a>';
      }

      function renderVideos(videos) {
        var holder = document.getElementById('loc-videos');
        if (!videos.length) {
          holder.innerHTML = '<p class="tr-soon">Video coming soon.</p>';
          return;
        }
        holder.innerHTML = videos.map(function (v, index) {
          var embedId = T.youtubeId(v.hosting_reference);
          var title = v.title ? T.esc(v.title) : 'Video ' + (index + 1);
          var player = embedId
            ? '<iframe src="https://www.youtube-nocookie.com/embed/' + embedId + '" title="' + title + '" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>'
            : '';
          var watch = embedId
            ? '<p><a href="https://www.youtube.com/watch?v=' + embedId + '">Watch on YouTube</a></p>'
            : '';
          return '<div class="tr-video" data-video-block="' + T.esc(v.id) + '"><h3>' + title + '</h3>' + player + watch +
            '<div class="tr-watch" data-watch-slot="' + T.esc(v.id) + '"></div></div>';
        }).join('');
      }

      // Watched ticks: signed-in people only. Everyone else sees a sign-in prompt.
      function renderWatchControls(watched) {
        var inProgress = document.getElementById('loc-progress');
        if (!userId) {
          inProgress.innerHTML = 'Want to tick off videos as you watch them? <a href="account.html">Sign in</a>.';
          return;
        }
        var done = 0;
        videoIds.forEach(function (vid) {
          var slot = document.querySelector('[data-watch-slot="' + vid + '"]');
          if (!slot) return;
          var isWatched = watched.indexOf(vid) !== -1;
          if (isWatched) done += 1;
          slot.innerHTML =
            '<button class="tr-button ' + (isWatched ? 'tr-secondary' : 'tr-quiet') + '" type="button" data-toggle="' + T.esc(vid) + '" aria-pressed="' + (isWatched ? 'true' : 'false') + '">' +
              (isWatched ? 'Watched: tap to undo' : 'Mark as watched') +
            '</button>' +
            '<span class="tr-watch-state' + (isWatched ? '' : ' is-off') + '">' + (isWatched ? 'Ticked off' : 'Not yet watched') + '</span>';
        });
        inProgress.textContent = videoIds.length ? done + ' of ' + videoIds.length + ' videos watched.' : '';
      }

      function toggleWatched(videoId, button) {
        var pressed = button.getAttribute('aria-pressed') === 'true';
        button.disabled = true;
        var request = pressed
          ? client.from('user_video_progress').delete().eq('user_id', userId).eq('video_id', videoId)
          : client.from('user_video_progress').upsert({ user_id: userId, video_id: videoId }, { onConflict: 'user_id,video_id' });
        request.then(function (result) {
          button.disabled = false;
          if (result.error) {
            document.getElementById('loc-progress').textContent = 'That did not save. Please try again.';
            return;
          }
          loadWatched();
        });
      }

      function loadWatched() {
        if (!userId || !videoIds.length) {
          renderWatchControls([]);
          return;
        }
        client.from('user_video_progress').select('video_id').eq('user_id', userId).in('video_id', videoIds)
          .then(function (result) {
            var watched = (result.data || []).map(function (r) { return r.video_id; });
            renderWatchControls(watched);
          });
      }

      function setupWatching() {
        client.auth.getSession().then(function (result) {
          var session = result.data && result.data.session;
          userId = session && session.user ? session.user.id : null;
          loadWatched();
        });
      }

      if (!client || !id || !uuid.test(id)) {
        fail('This guide could not be found.');
        return;
      }

      client.from('tricky_locations')
        .select('id, name, category, instructor_difficulty, description, driving_tips, common_mistakes, latitude, longitude, location_videos(sort_order, videos(id, title, hosting_reference, publication_status))')
        .eq('id', id)
        .eq('publication_status', 'published')
        .maybeSingle()
        .then(function (result) {
          if (result.error) {
            fail('This guide could not load. Please try again later.');
            return;
          }
          var row = result.data;
          if (!row || !T.LEVELS[row.instructor_difficulty]) {
            fail('This guide could not be found.');
            return;
          }

          document.title = row.name + ' | SAR Test Ready';
          status.textContent = '';
          document.getElementById('tr-location').hidden = false;

          var level = T.LEVELS[row.instructor_difficulty];
          document.getElementById('loc-name').textContent = row.name;
          var pill = document.getElementById('loc-level');
          pill.textContent = level.label;
          pill.className = 'tr-pill ' + level.className;

          setText('loc-description', row.description);
          renderDirections(row.latitude, row.longitude, row.name);

          var videos = (row.location_videos || [])
            .filter(function (lv) { return lv.videos && lv.videos.publication_status === 'published'; })
            .sort(function (a, b) { return a.sort_order - b.sort_order; })
            .map(function (lv) { return lv.videos; });
          videoIds = videos.map(function (v) { return v.id; });
          renderVideos(videos);

          setText('loc-tips', row.driving_tips);
          setText('loc-mistakes', row.common_mistakes);

          document.getElementById('loc-videos').addEventListener('click', function (event) {
            var button = event.target.closest('[data-toggle]');
            if (button && userId) toggleWatched(button.getAttribute('data-toggle'), button);
          });

          setupWatching();
        });
    })();
  </script>
</body>
</html>
