<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pass Gallery | SAR Driving School</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      background: #1f1f1f;
    }

    .gallery-page {
      background: #1f1f1f;
      min-height: 100vh;
      padding: 70px 2rem;
    }

    .gallery-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .gallery-header h1 {
      color: #ffffff;
      font-size: 3rem;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .gallery-header p {
      color: #bdbdbd;
      font-size: 1.05rem;
    }

    .gallery-filters {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .gallery-filter-btn {
      border: 1px solid #333333;
      background: #111111;
      color: #ffffff;
      padding: 0.8rem 1.2rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 800;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .gallery-filter-btn.active,
    .gallery-filter-btn:hover {
      background: #e01e26;
      border-color: #e01e26;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.3rem;
    }

    .gallery-card {
      background: #111111;
      border: 1px solid #333333;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .gallery-card:hover {
      transform: translateY(-5px);
      border-color: #e01e26;
    }

    .gallery-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    .gallery-card-content {
      padding: 1rem;
    }

    .gallery-card-content h3 {
      color: #ffffff;
      font-size: 1rem;
      margin-bottom: 0.25rem;
    }

    .gallery-card-content p {
      color: #999999;
      font-size: 0.9rem;
    }

    /* LIGHTBOX */
    .gallery-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .gallery-lightbox.open {
      display: flex;
    }

    .lightbox-content {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .lightbox-img-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 20px 70px rgba(0,0,0,0.7);
      background: #111111;
    }

    .lightbox-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .lightbox-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: #e01e26;
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .lightbox-btn:hover {
      transform: scale(1.08);
      background: #ff2630;
    }

    .lightbox-counter {
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      min-width: 95px;
      text-align: center;
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: #e01e26;
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 900;
      cursor: pointer;
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-close:hover {
      background: #ff2630;
    }

    @media (max-width: 1024px) {
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .hamburger {
        display: flex !important;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        cursor: pointer;
        padding: 8px;
        background: none;
        border: none;
        z-index: 201;
      }

      .hamburger span {
        display: block;
        width: 24px;
        height: 2px;
        background: #111111;
        border-radius: 2px;
        transition: all 0.3s ease;
      }

      .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      .hamburger.open span:nth-child(2) { opacity: 0; }
      .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

      nav ul {
        display: none !important;
      }

      nav ul.open {
        display: flex !important;
        flex-direction: column;
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        background: #ffffff;
        border-top: 1px solid #eeeeee;
        padding: 0.5rem 1.5rem 1.25rem;
        gap: 0;
        box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        z-index: 200;
      }

      nav ul a {
        display: block;
        padding: 0.9rem 0;
        font-size: 1rem;
        color: #111111;
        border-bottom: 1px solid #f0f0f0;
      }

      .nav-inner {
        position: relative;
        height: 70px;
      }

      .gallery-page {
        padding: 45px 1rem;
      }

      .gallery-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .gallery-header h1 {
        font-size: 2.2rem;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .gallery-img {
        height: 320px;
      }

      .gallery-lightbox {
        padding: 1rem;
      }

      .lightbox-img {
        max-height: 68vh;
        border-radius: 14px;
      }

      .lightbox-controls {
        gap: 0.8rem;
      }

      .lightbox-btn {
        width: 50px;
        height: 50px;
        font-size: 1.5rem;
      }

      .lightbox-close {
        top: 14px;
        right: 14px;
        width: 42px;
        height: 42px;
      }

      .whatsapp-float {
        width: 56px !important;
        height: 56px !important;
        bottom: 18px !important;
        right: 18px !important;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="SAR Driving School" class="logo-img">
      </a>

      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>

      <ul id="nav-menu">
        <li><a href="lessons.html">Lessons</a></li>
        <li><a href="pricing.html">Pricing</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="socials.html">Find us</a></li>
        <li><a href="book.html" class="btn-nav">Book now</a></li>
      </ul>
    </div>
  </nav>

  <main class="gallery-page">
    <div class="gallery-inner">

      <section class="gallery-header">
        <div>
          <div class="section-label">Pass gallery</div>
          <h1>Our happy passers</h1>
          <p>Browse through our learner pass gallery.</p>
        </div>

        <div class="gallery-filters">
          <button class="gallery-filter-btn active" data-limit="12">Show 12</button>
          <button class="gallery-filter-btn" data-limit="24">Show 24</button>
          <button class="gallery-filter-btn" data-limit="all">Show all</button>
        </div>
      </section>

      <section class="gallery-grid" id="galleryGrid"></section>

    </div>
  </main>

  <footer>
    <p>© 2026 SAR Driving School. Milton Keynes & surrounding areas.</p>
  </footer>

  <!-- LIGHTBOX -->
  <div class="gallery-lightbox" id="galleryLightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>

    <div class="lightbox-content">
      <div class="lightbox-img-wrap">
        <img src="" alt="Expanded pass photo" class="lightbox-img" id="lightboxImg">
      </div>

      <div class="lightbox-controls">
        <button class="lightbox-btn" id="lightboxPrev" aria-label="Previous">‹</button>
        <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
        <button class="lightbox-btn" id="lightboxNext" aria-label="Next">›</button>
      </div>
    </div>
  </div>

  <script>
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('nav-menu');

    hamburger.addEventListener('click', function() {
      hamburger.classList.toggle('open');
      navMenu.classList.toggle('open');
    });

    navMenu.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        hamburger.classList.remove('open');
        navMenu.classList.remove('open');
      });
    });

    const imageTimes = [
      "12.29.45", "12.29.40", "12.29.37", "12.29.33", "12.29.29", "12.29.25",
      "12.29.22", "12.29.17", "12.29.13", "12.29.10", "12.29.07", "12.29.02",
      "12.28.58", "12.28.55", "12.28.50", "12.28.47", "12.28.43", "12.28.40",
      "12.28.37", "12.28.33", "12.28.30", "12.28.27", "12.28.23", "12.28.20",
      "12.28.16", "12.28.11", "12.28.07", "12.28.03", "12.27.58", "12.27.49",
      "12.27.45", "12.27.36", "12.27.33", "12.27.28", "12.27.24", "12.27.19",
      "12.27.15", "12.27.08", "12.26.53", "12.26.41", "12.26.37", "12.26.34",
      "12.26.30", "12.26.26", "12.26.22", "12.26.17", "12.26.12", "12.26.08",
      "12.26.02", "12.25.54", "12.25.45", "12.25.39", "12.25.36", "12.25.29",
      "12.25.24", "12.25.19", "12.20.12", "12.20.09", "12.20.05", "12.20.02",
      "12.19.59", "12.19.46", "12.19.41", "12.19.38", "12.19.35", "12.19.31",
      "12.19.28", "12.19.25", "12.19.22", "12.19.17", "12.19.12", "12.19.09",
      "12.19.06", "12.19.01", "12.18.58", "12.18.54", "12.18.51", "12.18.47",
      "12.18.44", "12.18.40", "12.18.37", "12.18.33", "12.18.30", "12.18.26",
      "12.18.23", "12.18.19", "12.18.15", "12.18.10", "12.18.06", "12.17.59",
      "12.17.55", "12.17.51", "12.17.48", "12.17.42", "12.17.26", "12.17.20",
      "12.17.16", "12.17.13", "12.17.08", "12.17.04", "12.16.59", "12.16.55",
      "12.16.51", "12.16.46", "12.16.42", "12.16.31", "12.16.27", "12.16.22",
      "12.16.15", "12.16.05", "12.14.20"
    ];

    const allImages = imageTimes.map(function(time, index) {
      return {
        src: `images/passes/Screenshot 2026-05-17 at ${time} Small.jpeg`,
        title: "SAR Driving School pass",
        caption: `Pass photo ${index + 1}`
      };
    });

    const galleryGrid = document.getElementById('galleryGrid');
    const filterButtons = document.querySelectorAll('.gallery-filter-btn');

    let visibleImages = [];
    let currentLimit = 12;

    function renderGallery(limit) {
      galleryGrid.innerHTML = '';

      if (limit === 'all') {
        visibleImages = allImages;
      } else {
        visibleImages = allImages.slice(0, Number(limit));
      }

      visibleImages.forEach(function(image, index) {
        const card = document.createElement('div');
        card.className = 'gallery-card';

        card.innerHTML = `
          <img src="${image.src}" alt="${image.title}" class="gallery-img" loading="lazy">
          <div class="gallery-card-content">
            <h3>${image.title}</h3>
            <p>${image.caption}</p>
          </div>
        `;

        card.addEventListener('click', function() {
          openLightbox(index);
        });

        galleryGrid.appendChild(card);
      });
    }

    filterButtons.forEach(function(button) {
      button.addEventListener('click', function() {
        filterButtons.forEach(function(btn) {
          btn.classList.remove('active');
        });

        button.classList.add('active');

        currentLimit = button.dataset.limit;
        renderGallery(currentLimit);
      });
    });

    const lightbox = document.getElementById('galleryLightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');
    const lightboxPrev = document.getElementById('lightboxPrev');
    const lightboxNext = document.getElementById('lightboxNext');
    const lightboxCounter = document.getElementById('lightboxCounter');

    let currentImageIndex = 0;

    function openLightbox(index) {
      currentImageIndex = index;
      updateLightbox();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function updateLightbox() {
      const image = visibleImages[currentImageIndex];
      lightboxImg.src = image.src;
      lightboxImg.alt = image.title;
      lightboxCounter.textContent = `${currentImageIndex + 1} / ${visibleImages.length}`;
    }

    function showPreviousImage() {
      currentImageIndex = (currentImageIndex - 1 + visibleImages.length) % visibleImages.length;
      updateLightbox();
    }

    function showNextImage() {
      currentImageIndex = (currentImageIndex + 1) % visibleImages.length;
      updateLightbox();
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightboxPrev.addEventListener('click', showPreviousImage);
    lightboxNext.addEventListener('click', showNextImage);

    lightbox.addEventListener('click', function(event) {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', function(event) {
      if (!lightbox.classList.contains('open')) return;

      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowLeft') showPreviousImage();
      if (event.key === 'ArrowRight') showNextImage();
    });

    let touchStartX = 0;
    let touchEndX = 0;

    lightbox.addEventListener('touchstart', function(event) {
      touchStartX = event.changedTouches[0].screenX;
    });

    lightbox.addEventListener('touchend', function(event) {
      touchEndX = event.changedTouches[0].screenX;

      if (touchStartX - touchEndX > 50) {
        showNextImage();
      }

      if (touchEndX - touchStartX > 50) {
        showPreviousImage();
      }
    });

    renderGallery(12);
  </script>

</body>
</html>
