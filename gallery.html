<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pass Gallery | SAR Driving School</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      background: #1f1f1f;
    }

    .gallery-page {
      background: #1f1f1f;
      min-height: 100vh;
      padding: 90px 2rem 70px;
    }

    .gallery-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .gallery-header h1 {
      color: #ffffff;
      font-size: 3rem;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .gallery-header p {
      color: #bdbdbd;
      font-size: 1.05rem;
    }

    .gallery-filters {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .gallery-filter-btn {
      border: 1px solid #333333;
      background: #111111;
      color: #ffffff;
      padding: 0.8rem 1.2rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 800;
    }

    .gallery-filter-btn.active,
    .gallery-filter-btn:hover {
      background: #e01e26;
      border-color: #e01e26;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.3rem;
    }

    .gallery-card {
      background: #111111;
      border: 1px solid #333333;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      aspect-ratio: 4 / 3;
    }

    .gallery-card:hover {
      transform: translateY(-5px);
      border-color: #e01e26;
    }

    .gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000000;
    }

    .gallery-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .gallery-lightbox.open {
      display: flex;
    }

    .lightbox-content {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 20px 70px rgba(0,0,0,0.7);
      background: #111111;
    }

    .lightbox-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .lightbox-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: #e01e26;
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-counter {
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      min-width: 95px;
      text-align: center;
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: #e01e26;
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 900;
      cursor: pointer;
      z-index: 100000;
    }

    @media (max-width: 1024px) {
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .hamburger {
        display: flex !important;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        cursor: pointer;
        padding: 8px;
        background: none;
        border: none;
        z-index: 201;
      }

      .hamburger span {
        display: block;
        width: 24px;
        height: 2px;
        background: #111111;
        border-radius: 2px;
        transition: all 0.3s ease;
      }

      .hamburger.open span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }

      .hamburger.open span:nth-child(2) {
        opacity: 0;
      }

      .hamburger.open span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }

      nav ul {
        display: none !important;
      }

      nav ul.open {
        display: flex !important;
        flex-direction: column;
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        background: #ffffff;
        border-top: 1px solid #eeeeee;
        padding: 0.5rem 1.5rem 1.25rem;
        gap: 0;
        box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        z-index: 200;
      }

      nav ul a {
        display: block;
        padding: 0.9rem 0;
        font-size: 1rem;
        color: #111111;
        border-bottom: 1px solid #f0f0f0;
      }

      .nav-inner {
        position: relative;
        height: 70px;
      }

      .gallery-page {
        padding: 55px 1rem 45px;
      }

      .gallery-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .gallery-header h1 {
        font-size: 2.2rem;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .gallery-card {
        aspect-ratio: 4 / 3;
      }

      .gallery-lightbox {
        padding: 1rem;
      }

      .lightbox-img {
        max-height: 68vh;
      }

      .lightbox-btn {
        width: 50px;
        height: 50px;
      }

      .lightbox-close {
        top: 14px;
        right: 14px;
        width: 42px;
        height: 42px;
      }

      .whatsapp-float {
        width: 56px !important;
        height: 56px !important;
        bottom: 18px !important;
        right: 18px !important;
      }
    }
  </style>
</head>

<body>

        <li><a href="socials.html">Find us</a></li>

      </ul>

  <main class="gallery-page">
    <div class="gallery-inner">

      <section class="gallery-header">
        <div>
          <div class="section-label">Pass gallery</div>
          <h1>Our happy passers</h1>
          <p>Browse through our learner pass gallery.</p>
        </div>

        <div class="gallery-filters">
          <button class="gallery-filter-btn active" onclick="showGalleryAmount(12, this)">Show 12</button>
          <button class="gallery-filter-btn" onclick="showGalleryAmount(24, this)">Show 24</button>
          <button class="gallery-filter-btn" onclick="showGalleryAmount('all', this)">Show all</button>
        </div>
      </section>

      <section class="gallery-grid" id="galleryGrid"></section>

    </div>
  </main>

  <footer>
    <p>© 2026 SAR Driving School. Milton Keynes & surrounding areas.</p>
  </footer>

  <div class="gallery-lightbox" id="galleryLightbox">
    <button class="lightbox-close" id="lightboxClose">×</button>

    <div class="lightbox-content">
      <img src="" alt="Expanded pass photo" class="lightbox-img" id="lightboxImg">

      <div class="lightbox-controls">
        <button class="lightbox-btn" id="lightboxPrev">‹</button>
        <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
        <button class="lightbox-btn" id="lightboxNext">›</button>
      </div>
    </div>
  </div>

  <script>
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('nav-menu');

    hamburger.addEventListener('click', function() {
      hamburger.classList.toggle('open');
      navMenu.classList.toggle('open');
    });

    navMenu.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        hamburger.classList.remove('open');
        navMenu.classList.remove('open');
      });
    });

    const galleryGrid = document.getElementById('galleryGrid');
    const totalImages = 111;

    const passImages = Array.from({ length: totalImages }, function(_, index) {
      const number = String(index + 1).padStart(3, '0');
      return `images/passes/pass${number}.jpg`;
    });

    passImages.forEach(function(src) {
      const card = document.createElement('div');
      card.className = 'gallery-card';

      card.innerHTML = `
        <img src="${src}" alt="SAR Driving School pass" class="gallery-img" loading="lazy">
      `;

      galleryGrid.appendChild(card);
    });

    let galleryCards = Array.from(document.querySelectorAll('.gallery-card'));
    let galleryImages = Array.from(document.querySelectorAll('.gallery-img'));

    function showGalleryAmount(amount, button) {
      document.querySelectorAll('.gallery-filter-btn').forEach(function(btn) {
        btn.classList.remove('active');
      });

      button.classList.add('active');

      galleryCards.forEach(function(card, index) {
        if (amount === 'all' || index < amount) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    const lightbox = document.getElementById('galleryLightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');
    const lightboxPrev = document.getElementById('lightboxPrev');
    const lightboxNext = document.getElementById('lightboxNext');
    const lightboxCounter = document.getElementById('lightboxCounter');

    let currentImageIndex = 0;

    function getVisibleImages() {
      return galleryImages.filter(function(img) {
        return img.closest('.gallery-card').style.display !== 'none';
      });
    }

    function openLightbox(index) {
      const clickedImage = galleryImages[index];
      const visibleImages = getVisibleImages();

      currentImageIndex = visibleImages.indexOf(clickedImage);

      if (currentImageIndex < 0) {
        currentImageIndex = 0;
      }

      updateLightbox();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function updateLightbox() {
      const visibleImages = getVisibleImages();
      const image = visibleImages[currentImageIndex];

      lightboxImg.src = image.src;
      lightboxImg.alt = image.alt;
      lightboxCounter.textContent = `${currentImageIndex + 1} / ${visibleImages.length}`;
    }

    function showPreviousImage() {
      const visibleImages = getVisibleImages();
      currentImageIndex = (currentImageIndex - 1 + visibleImages.length) % visibleImages.length;
      updateLightbox();
    }

    function showNextImage() {
      const visibleImages = getVisibleImages();
      currentImageIndex = (currentImageIndex + 1) % visibleImages.length;
      updateLightbox();
    }

    galleryImages.forEach(function(image, index) {
      image.addEventListener('click', function() {
        openLightbox(index);
      });
    });

    lightboxClose.addEventListener('click', closeLightbox);
    lightboxPrev.addEventListener('click', showPreviousImage);
    lightboxNext.addEventListener('click', showNextImage);

    lightbox.addEventListener('click', function(event) {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', function(event) {
      if (!lightbox.classList.contains('open')) return;

      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowLeft') showPreviousImage();
      if (event.key === 'ArrowRight') showNextImage();
    });

    let touchStartX = 0;
    let touchEndX = 0;

    lightbox.addEventListener('touchstart', function(event) {
      touchStartX = event.changedTouches[0].screenX;
    });

    lightbox.addEventListener('touchend', function(event) {
      touchEndX = event.changedTouches[0].screenX;

      if (touchStartX - touchEndX > 50) {
        showNextImage();
      }

      if (touchEndX - touchStartX > 50) {
        showPreviousImage();
      }
    });

    showGalleryAmount(12, document.querySelector('.gallery-filter-btn.active'));
  </script>
